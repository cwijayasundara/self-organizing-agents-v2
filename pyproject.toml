[project]
name = "agora-v2"
version = "0.1.0"
description = "Bounded dynamic peer swarm experiment"
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = []

[project.scripts]
agora-v2 = "agora_v2.cli:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agora_v2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live and not sandbox'"
markers = ["live: explicit capped provider smoke", "sandbox: real container isolation"]

[tool.hatch.build.targets.wheel.force-include]
"examples/evidence_review" = "agora_v2/data/evidence_review"
